name: Build & Push

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bitherder
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate semver tag
        id: version
        run: echo "tag=0.1.0-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/bitherder/peptide-search:latest
            docker.io/bitherder/peptide-search:${{ steps.version.outputs.tag }}
